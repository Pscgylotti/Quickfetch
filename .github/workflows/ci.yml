name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Quickfetch -c Release
      - run: dotnet run --project Quickfetch.Tests -c Release
      - run: dotnet run --project Quickfetch.IconTests -c Release
      - run: dotnet run --project Quickfetch.UiTests -c Release
      - run: node --test browser-extension/test.cjs
